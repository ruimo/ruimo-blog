<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" aria-labelledby="title desc">
  <title id="title">TYPE-Cで5Vを受電するためのCCプルダウン</title>
  <desc id="desc">TYPE-A充電器はVBUSに5Vを出力する。TYPE-C充電器はCC端子のプルダウンで受電機器を検出してから5Vを出力する。機器側のTYPE-CレセプタクルのCC1とCC2は、それぞれ独立した5.1キロオーム抵抗を介してGNDに接続する。CC1とCC2を直接つないではいけない。図は電源用の概略配線で、端子の物理的な配置ではない。</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #243447; }
      .heading { font-size: 22px; font-weight: bold; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
      .wire { fill: none; stroke: #56738b; stroke-width: 3; }
      .cc { fill: none; stroke: #338359; stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="#56738b"/>
    </marker>
  </defs>
  <rect width="880" height="700" rx="16" fill="#fff"/>
  <rect x="20" y="20" width="840" height="190" rx="12" fill="#f0f5fa"/>
  <text x="42" y="55" class="heading">充電器によって、5Vを出す条件が違う</text>
  <text x="46" y="100" class="label">TYPE-A充電器</text>
  <path d="M210 94H350" class="wire" marker-end="url(#arrow)"/>
  <text x="380" y="100" class="label">VBUSに5Vを出力</text>
  <text x="46" y="145" class="label">TYPE-C充電器</text>
  <path d="M210 139H350" class="wire" marker-end="url(#arrow)"/>
  <text x="380" y="145" class="label">CCのプルダウンを検出してから5Vを出力</text>
  <text x="380" y="181" class="small">抵抗がないと機器を検出できず、給電されない</text>

  <rect x="20" y="230" width="840" height="450" rx="12" fill="#eef8f1"/>
  <text x="42" y="268" class="heading">機器側：CC1・CC2にそれぞれ5.1kΩを入れる</text>
  <text x="100" y="309" text-anchor="middle" class="small">TYPE-C端子</text>
  <rect x="45" y="325" width="110" height="255" rx="12" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <text x="100" y="362" text-anchor="middle" class="label">VBUS</text>
  <text x="100" y="427" text-anchor="middle" class="label">CC1</text>
  <text x="100" y="492" text-anchor="middle" class="label">CC2</text>
  <text x="100" y="557" text-anchor="middle" class="label">GND</text>

  <path d="M155 355H740" class="wire" marker-end="url(#arrow)"/>
  <text x="520" y="340" class="label">機器の電源へ（5V）</text>
  <path d="M155 420H285V470 M285 514V550 M155 485H410V500 M410 534V550 M155 550H740" class="cc"/>
  <rect x="275" y="470" width="20" height="44" fill="#fff" stroke="#338359" stroke-width="3"/>
  <rect x="400" y="500" width="20" height="34" fill="#fff" stroke="#338359" stroke-width="3"/>
  <text x="230" y="462" class="small">5.1kΩ</text>
  <text x="435" y="537" class="small">5.1kΩ</text>
  <circle cx="285" cy="550" r="5" fill="#338359"/>
  <circle cx="410" cy="550" r="5" fill="#338359"/>
  <path d="M690 550V574 M672 574H708 M678 582H702 M684 590H696" class="wire"/>
  <text x="720" y="580" class="small">GND</text>
  <text x="500" y="416" class="label" fill="#338359">抵抗は2本、別々につなぐ</text>
  <text x="500" y="447" class="small">CC1とCC2を直結しない</text>
  <text x="42" y="627" class="small">※ 電源用の概略図。端子の物理的な配置や、データ線などは省略。</text>
  <text x="42" y="653" class="small">※ 取り出せる電流は充電器・ケーブルの仕様とCCの通知に従う。</text>
</svg>
