<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
  <title id="title">複数のACアダプターを多ポートUSB充電器1台にまとめる</title>
  <desc id="desc">上段は電源タップに3つのACアダプターを挿して、それぞれの機器に給電する構成。下段は電源タップの差込口を1つだけ使い、多ポートUSB充電器から3本のUSBケーブルで各機器に給電する構成。</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #243447; }
      .heading { font-size: 22px; font-weight: bold; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
      .wire { fill: none; stroke: #56738b; stroke-width: 5; stroke-linecap: round; }
      .device { fill: #fff; stroke: #338359; stroke-width: 2; }
    </style>
    <g id="outlet" fill="#708090">
      <rect x="-10" y="-9" width="5" height="18" rx="2"/>
      <rect x="5" y="-9" width="5" height="18" rx="2"/>
    </g>
    <g id="device">
      <rect width="140" height="48" rx="8" class="device"/>
      <circle cx="122" cy="24" r="4" fill="#338359"/>
    </g>
  </defs>
  <rect width="880" height="620" rx="16" fill="#fff"/>
  <rect x="20" y="20" width="840" height="276" rx="12" fill="#f0f5fa"/>
  <rect x="20" y="312" width="840" height="288" rx="12" fill="#eef8f1"/>
  <text x="42" y="55" class="heading">これまで：機器ごとにACアダプター</text>
  <text x="42" y="347" class="heading">多ポートUSB充電器なら：1台にまとめられる</text>

  <!-- 電源タップの3つの差込口を、それぞれのアダプターが使用 -->
  <rect x="76" y="88" width="96" height="168" rx="14" fill="#fff" stroke="#708090" stroke-width="2"/>
  <path d="M76 172H42" class="wire"/>
  <g fill="#fff" stroke="#56738b" stroke-width="2">
    <rect x="104" y="98" width="150" height="44" rx="7"/>
    <rect x="104" y="150" width="150" height="44" rx="7"/>
    <rect x="104" y="202" width="150" height="44" rx="7"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="179" y="127">ACアダプター</text>
    <text x="179" y="179">ACアダプター</text>
    <text x="179" y="231">ACアダプター</text>
  </g>
  <path d="M254 120C360 120 400 224 510 224H650 M254 172H650 M254 224C360 224 400 120 510 120H650" class="wire"/>
  <use href="#device" x="650" y="96"/>
  <use href="#device" x="650" y="148"/>
  <use href="#device" x="650" y="200"/>
  <g class="label" text-anchor="middle">
    <text x="710" y="127">機器1</text>
    <text x="710" y="179">機器2</text>
    <text x="710" y="231">機器3</text>
  </g>
  <text x="124" y="279" class="small" text-anchor="middle">差込口を3つ使用</text>
  <text x="445" y="269" class="small" text-anchor="middle">アダプターも配線もかさばる</text>

  <!-- 同じ3台を1つのUSB充電器から給電 -->
  <rect x="76" y="380" width="96" height="168" rx="14" fill="#fff" stroke="#708090" stroke-width="2"/>
  <path d="M76 464H42 M172 412H280" class="wire"/>
  <use href="#outlet" x="124" y="412"/>
  <use href="#outlet" x="124" y="464"/>
  <use href="#outlet" x="124" y="516"/>
  <rect x="280" y="384" width="200" height="160" rx="12" fill="#fff" stroke="#338359" stroke-width="2"/>
  <text x="370" y="449" class="label" text-anchor="middle">多ポート</text>
  <text x="370" y="477" class="label" text-anchor="middle">USB充電器</text>
  <g fill="#338359">
    <rect x="466" y="400" width="14" height="24" rx="2"/>
    <rect x="466" y="452" width="14" height="24" rx="2"/>
    <rect x="466" y="504" width="14" height="24" rx="2"/>
  </g>
  <path d="M480 412H650 M480 464H650 M480 516H650" class="wire"/>
  <use href="#device" x="650" y="388"/>
  <use href="#device" x="650" y="440"/>
  <use href="#device" x="650" y="492"/>
  <g class="label" text-anchor="middle">
    <text x="710" y="419">機器1</text>
    <text x="710" y="471">機器2</text>
    <text x="710" y="523">機器3</text>
  </g>
  <text x="124" y="575" class="small" text-anchor="middle">差込口は1つだけ</text>
  <text x="565" y="566" class="small" text-anchor="middle">USBケーブルで各機器へ</text>
  <text x="565" y="589" class="small" text-anchor="middle">※充電器の合計出力・各ポートの定格内で使用</text>
</svg>
