<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
  <title id="title">機器側をTYPE-Cにして、充電器とケーブルを将来置き換える</title>
  <desc id="desc">今は余っているTYPE-A充電器とTYPE-A・TYPE-Cケーブルを使い、将来はTYPE-C充電器とTYPE-C・TYPE-Cケーブルへ移行する。機器側のTYPE-C端子は共通で、そのまま使える。</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #243447; }
      .heading { font-size: 22px; font-weight: bold; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
      .wire { fill: none; stroke: #56738b; stroke-width: 6; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#56738b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="880" height="460" rx="16" fill="#fff"/>
  <rect x="20" y="20" width="840" height="184" rx="12" fill="#f0f5fa"/>
  <rect x="20" y="256" width="840" height="184" rx="12" fill="#eef8f1"/>
  <text x="42" y="55" class="heading">今：家で余っている充電器を活用</text>
  <text x="42" y="291" class="heading">将来：充電器とケーブルをTYPE-Cへ</text>

  <!-- 現在のTYPE-A充電器 -->
  <path d="M80 113H62 M80 137H62" stroke="#708090" stroke-width="7"/>
  <rect x="80" y="88" width="158" height="76" rx="10" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <text x="159" y="118" text-anchor="middle" class="label">充電器</text>
  <text x="159" y="144" text-anchor="middle" class="label">TYPE-A</text>
  <rect x="230" y="115" width="12" height="22" rx="1" fill="#243447"/>
  <path d="M260 126H578" class="wire"/>
  <rect x="246" y="116" width="26" height="20" rx="2" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <rect x="568" y="118" width="25" height="16" rx="8" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <text x="420" y="101" text-anchor="middle" class="label">TYPE-A − TYPE-C</text>
  <text x="420" y="163" text-anchor="middle" class="small">ケーブル</text>

  <!-- 将来のTYPE-C充電器 -->
  <path d="M80 349H62 M80 373H62" stroke="#708090" stroke-width="7"/>
  <rect x="80" y="324" width="158" height="76" rx="10" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <text x="159" y="354" text-anchor="middle" class="label">充電器</text>
  <text x="159" y="380" text-anchor="middle" class="label">TYPE-C</text>
  <rect x="230" y="352" width="12" height="18" rx="6" fill="#243447"/>
  <path d="M260 362H578" class="wire"/>
  <rect x="246" y="354" width="25" height="16" rx="8" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <rect x="568" y="354" width="25" height="16" rx="8" fill="#fff" stroke="#56738b" stroke-width="2"/>
  <text x="420" y="337" text-anchor="middle" class="label">TYPE-C − TYPE-C</text>
  <text x="420" y="399" text-anchor="middle" class="small">ケーブル</text>

  <!-- 機器側は両方とも同じTYPE-C端子 -->
  <g fill="#fff" stroke="#338359" stroke-width="2">
    <rect x="606" y="88" width="208" height="76" rx="10"/>
    <rect x="606" y="324" width="208" height="76" rx="10"/>
  </g>
  <rect x="600" y="117" width="12" height="18" rx="6" fill="#338359"/>
  <rect x="600" y="353" width="12" height="18" rx="6" fill="#338359"/>
  <text x="710" y="118" text-anchor="middle" class="label">電子工作の機器</text>
  <text x="710" y="144" text-anchor="middle" class="label">入力：TYPE-C</text>
  <text x="710" y="354" text-anchor="middle" class="label">電子工作の機器</text>
  <text x="710" y="380" text-anchor="middle" class="label">入力：TYPE-C</text>

  <path d="M160 211V244" stroke="#56738b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M420 211V244" stroke="#56738b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="594" y="210" width="232" height="40" rx="20" fill="#338359"/>
  <text x="710" y="237" text-anchor="middle" style="font-size:19px;font-weight:bold;fill:#fff">機器はそのまま！</text>
</svg>
