  <title
     id="title">スピーカーにかかる電力の測定方法</title>
  <desc
     id="desc">スピーカー両端の電圧と、直列シャント抵抗の電圧降下から求めた電流を使って、スピーカーの電力を計算する方法を示す回路図。</desc>
