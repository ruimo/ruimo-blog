       gradientTransform="scale(1.2649111,0.62365772)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#091521"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#142f3e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="panel"
       x1="77.292595"
       y1="286.90976"
